name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # CI 只检查构建，不下载模型；部署构建（Cloudflare Pages 等）会自动下载
      - run: pnpm build
        env:
          A2R_MODELS: none
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
