# Anime2Real 的 Nginx 示例配置（见 docs/Plan.md §1.4）。
# 把 `pnpm build` 生成的 dist/ 目录内容放到 root 指向的位置，再按实际情况修改
# server_name、证书路径后 include 到 http {} 中。
#
# 注意：location 里只要出现 add_header，就不会再继承 server 级的 add_header，
# 所以每个 location 都重复写了一遍安全相关的响应头。

server {
    listen 80;
    listen [::]:80;
    server_name anime2real.example.com;
    return 301 https://$host$request_uri;
}

server {
    # WebGPU、Cache API 只在安全上下文（HTTPS）中可用。
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name anime2real.example.com;

    ssl_certificate     /etc/ssl/anime2real/fullchain.pem;
    ssl_certificate_key /etc/ssl/anime2real/privkey.pem;

    root /var/www/anime2real;
    index index.html;
    charset utf-8;

    # .wasm 必须以 application/wasm 返回，流式编译才能工作。
    # 发行版自带的 mime.types 一般已包含这一项，可用下面的命令确认：
    #   grep wasm /etc/nginx/mime.types
    # 如果没有，在 mime.types 中加入：application/wasm wasm;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    # 如果安装了 ngx_brotli 模块，可以再开启 Brotli：
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # index.html 不缓存，保证发布新版本后立即生效。
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # 构建产物文件名带内容哈希，可以永久缓存。
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 模型文件放在带版本号的目录里，换模型即换路径，同样可以永久缓存。
    # ONNX 文件本身压缩率很低，不做 gzip。
    location /models/ {
        gzip off;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
